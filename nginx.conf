server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # No directory browsing
  autoindex off;

  location / {
    try_files $uri $uri/ =404;
  }

  # NOTE: nginx drops server-level add_header in any location that has its
  # own add_header, so the two security headers are repeated below.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Service worker and PWA manifest must never be aggressively cached,
  # otherwise users get stuck on stale app shells.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    expires off;
    try_files $uri =404;
  }

  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    expires off;
    try_files $uri =404;
  }

  # Cache static assets aggressively.
  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  location ~* \.json$ {
    default_type application/json;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }
}
